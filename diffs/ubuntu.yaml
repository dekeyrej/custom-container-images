files:
# allow ubuntu to sudo with no password JSD
- path: /etc/sudoers.d/90-sudo-nopasswd
  generator: dump
  mode: 0440
  content: |-
    # User rules for ubuntu
    ubuntu ALL=(ALL) NOPASSWD:ALL
  variants:
    - default

# add authorized_keys for hosts to ssh in as ubuntu JSD
- path: /home/ubuntu/.ssh/authorized_keys
  generator: copy
  source: authorized_keys
  mode: 0600
  uid: 1000
  gid: 1000
  variants:
  - default

packages:
  manager: apt
  update: true
  cleanup: true
  sets:
  - packages:
    - fuse3
    releases:
    - jammy
    - noble
    - plucky
    - questing
    action: install

  - packages:
    - openssh-client
    - openssh-server  # allow ssh in JSD
    - sudo
    - vim
    action: install

actions:
# add default user JSD
- trigger: post-update
  action: |-
    #!/bin/sh
    set -eux

    # Create the ubuntu user account
    getent group sudo >/dev/null 2>&1 || groupadd --system sudo
    useradd --create-home -s /bin/bash -G sudo -U ubuntu
  variants:
  - default
