files:
# allow debian to sudo with no password JSD
- path: /etc/sudoers.d/90-sudo-nopasswd
  generator: dump
  mode: 0440
  content: |-
    # User rules for debian
    debian ALL=(ALL) NOPASSWD:ALL
  variants:
    - default

# add authorized_keys for hosts to ssh in as debian JSD
- path: /home/debian/.ssh/authorized_keys
  generator: copy
  source: authorized_keys
  mode: 0600
  uid: 1000
  gid: 1000
  variants:
  - default

