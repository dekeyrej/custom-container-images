files:
# allow debian to sudo with no password JSD
- path: /etc/sudoers.d/90-sudo-nopasswd
  generator: dump
  mode: 0440
  content: |-
    # User rules for debian
    debian ALL=(ALL) NOPASSWD:ALL
  variants:
    - default

# add authorized_keys for hosts to ssh in as debian JSD
- path: /home/debian/.ssh/authorized_keys
  generator: copy
  source: authorized_keys
  mode: 0600
  uid: 1000
  gid: 1000
  variants:
  - default

packages:
  manager: apt
  update: true
  cleanup: true
  sets:
  - packages:
    - dialog
    - init
    - iproute2
    - iputils-ping
    - isc-dhcp-client
    - locales
    - netbase
    - net-tools
    - openssh-client
    - ifupdown        # added to make Proxmox-VE 9 happy JSD
    - openssh-server  # allow ssh _in_ JSD
    - python3-debian  # allow ansible management JSD
    - procps
    - sudo
    - vim
    action: install

actions:
# create debian user JSD
- trigger: post-update
  action: |-
    #!/bin/sh
    set -eux

    # Create the debian user account
    getent group sudo >/dev/null 2>&1 || groupadd --system sudo
    useradd --create-home -s /bin/bash -G sudo -U debian
  variants:
  - default
