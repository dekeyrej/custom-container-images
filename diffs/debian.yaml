packages:
  manager: apt
  update: true
  cleanup: true
  sets:
  - packages:
    - dialog
    - init
    - iproute2
    - iputils-ping
    - isc-dhcp-client
    - locales
    - netbase
    - net-tools
    - openssh-client
    - ifupdown        # added to make Proxmox-VE 9 happy JSD
    - openssh-server  # allow ssh _in_ JSD
    - python3-debian  # allow ansible management JSD
    - procps
    - sudo
    - vim
    action: install

actions:
# create debian user JSD
- trigger: post-update
  action: |-
    #!/bin/sh
    set -eux

    # Create the debian user account
    getent group sudo >/dev/null 2>&1 || groupadd --system sudo
    useradd --create-home -s /bin/bash -G sudo -U debian
  variants:
  - default

