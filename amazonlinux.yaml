image:
  distribution: amazonlinux

# source:
#   downloader: rootfs-http
#   url: https://cdn.amazonlinux.com/os-images/{{ image.release }}/{% if image.architecture == "aarch64" %}container-arm64{% else %}container{% endif %}/amzn2-container-raw-{{ image.release }}-{% if image.architecture == "aarch64" %}arm64{% else %}{{ image.architecture }}{% endif %}.tar.xz

source:
  downloader: rootfs-http
  url: file:///home/ubuntu/repos/custom-container-images/al2023-container-2023.10.20260105.0-x86_64.tar.xz

targets:
  lxc:
    create_message: |
      You just created a {{ image.description }} container.
    config:
    - type: all
      before: 5
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/rocky.common.conf
    - type: user
      before: 5
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/rocky.userns.conf
    - type: all
      after: 4
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/common.conf
    - type: user
      after: 4
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/userns.conf
    - type: all
      content: |-
        lxc.arch = {{ image.architecture_kernel }}

files:
# JSD allow ecs-user to sudo without password
- path: /etc/sudoers.d/90-sudo-nopasswd
  generator: dump
  mode: 0440
  content: |-
    # User rules for ecs-user
    ecs-user ALL=(ALL) NOPASSWD:ALL
  variants:
    - default

# JSD allow key-based ssh login as ecs-user
- path: /home/ecs-user/.ssh/authorized_keys
  generator: copy
  source: authorized_keys  # or any file with public keys
  mode: 0600
  uid: 1000
  gid: 1000
  variants:
  - default

- name: hostname
  path: /etc/hostname
  generator: hostname

- name: hosts
  path: /etc/hosts
  generator: hosts

- path: /etc/machine-id
  generator: dump
  content: uninitialized

- path: /var/lib/dbus/machine-id
  generator: remove

- name: eth0.network
  path: /etc/systemd/network/eth0.network
  generator: dump
  content: |-
    [Match]
    Name=eth0

    [Network]
    DHCP=ipv4

    [DHCPv4]
    UseDomains=true
    UseMTU=true

    [DHCP]
    ClientIdentifier=mac
- path: /etc/fstab
  generator: dump

packages:
  manager: yum
  update: true
  cleanup: true
  sets:
  - packages:
    - iproute
    - shadow-utils      # JSD groupadd/useradd
    - sudo
    - systemd
    - systemd-networkd
    - systemd-resolved
    - systemd-udev
    - openssh-server    # JSD allow ssh in
    action: install

actions:
# JSD create sudo group and ecs-user user
- trigger: post-packages
  action: |-
    #!/bin/sh
    set -eux

    # Create the sudo usergroup
    getent group sudo >/dev/null 2>&1 || groupadd --system sudo
    # Create the ecs-user user account
    useradd --create-home -s /bin/bash -G sudo -U ecs-user
  variants:
  - default

- trigger: post-unpack
  action: |-
    #!/bin/sh
    # Make sure we have our template targets
    touch /etc/hosts
    touch /etc/hostname

- trigger: post-packages
  action: |-
    #!/bin/sh
    umount -l /etc/resolv.conf || true
    rm /etc/resolv.conf
    ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
    cp -R /etc/skel/.bash* /root/

    systemctl enable systemd-resolved
    systemctl enable systemd-networkd

    rm -rf /var/cache/yum
